<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Камеры · CCTV</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171717;
      --panel: #212121;
      --panel-border: #303030;
      --text: #ececec;
      --muted: #a3a3a3;
      --accent: #10a37f;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(100%, 1800px);
      margin: 0 auto;
      padding: 32px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      content: "";
    }

    .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    button {
      background: var(--text); color: var(--bg); border: 0; border-radius: 24px;
      padding: 10px 18px; font: inherit; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #d3d3d3; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    button:disabled { opacity: 0.5; cursor: wait; }
    button[aria-pressed="true"] { background: var(--accent); color: white; }
    .people-count { margin-left: auto; color: var(--muted); font-size: 12px; }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      padding-bottom: 12px;
      scrollbar-color: #4d4d4d transparent;
    }

    .camera-card {
      grid-column: span 2;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgb(0 0 0 / 20%);
    }

    .camera-card:last-child:nth-child(odd) {
      grid-column: 2 / span 2;
    }

    .camera-card__header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
    }

    .camera-card__indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .camera-card h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
    }

    .camera-card__stream {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0d0d0d;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      .page { padding: 20px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 10px; }
      .camera-grid { grid-template-columns: minmax(0, 1fr); }
      .camera-card,
      .camera-card:last-child:nth-child(odd) { grid-column: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <h1>Камеры</h1>
      <div class="controls">
        <span class="status" id="detection-status" role="status">Детекция выключена</span>
        <button id="detection-toggle" type="button" aria-pressed="false">Включить детекцию людей</button>
      </div>
    </header>

    <div class="camera-grid" aria-label="Потоки камер">
      {% for channel in channels %}
      <section class="camera-card">
        <header class="camera-card__header">
          <span class="camera-card__indicator" aria-hidden="true"></span>
          <h2>Камера {{ channel }}</h2>
          <span class="people-count" data-channel="{{ channel }}">Людей: —</span>
        </header>
        <img class="camera-card__stream" src="{{ url_for('stream', channel=channel) }}" alt="Поток камеры {{ channel }}">
      </section>
      {% endfor %}
    </div>
  </main>
  <script src="{{ url_for('static', filename='detection.js') }}" defer></script>
</body>
</html>
